<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CBM Complete Framework — Trinamix</title>
<style>
  :root{
    --indigo:#26007E;
    --violet-start:#2C0385;
    --violet:#9E42FF;
    --teal:#0EA5A5;
    --charcoal:#22252B;
    --slate:#595966;
    --white:#FFFFFF;
    --stage-w: 1920px;
    --stage-h: 1080px;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{
    width:100%; height:100%; overflow:hidden;
    background: #12042E;
    font-family: "Calibri","Segoe UI",Arial,sans-serif;
    color: var(--charcoal);
  }
  #viewport{
    position:fixed; inset:0;
    display:flex; align-items:center; justify-content:center;
    background:
      radial-gradient(1200px 800px at 15% 10%, rgba(158,66,255,.16), transparent 60%),
      radial-gradient(1000px 700px at 85% 90%, rgba(14,165,165,.14), transparent 60%),
      #12042E;
  }
  #stage{
    position:relative;
    width:var(--stage-w); height:var(--stage-h);
    background:#ffffff;
    overflow:hidden;
    box-shadow: 0 40px 120px rgba(0,0,0,.55);
    border-radius: 6px;
  }

  /* ---------- SLIDES ---------- */
  .slide{
    position:absolute; inset:0;
    opacity:0; pointer-events:none;
    display:flex; flex-direction:column;
    overflow:hidden;
  }
  .slide.active{ opacity:1; pointer-events:auto; z-index:2; }
  .slide.leaving{ opacity:1; z-index:1; }
  .slide.leaving .reveal{ animation: revealOut .45s ease forwards; }
  .slide .reveal{ opacity:0; }
  .slide.active .reveal{
    animation: revealIn .7s cubic-bezier(.16,1,.3,1) forwards;
    animation-delay: calc(var(--i,0) * 70ms);
  }
  .slide.active .ptable-cell.reveal{
    animation-delay: calc(var(--i,0) * 16ms);
  }
  @keyframes revealIn{
    from{ opacity:0; transform: translateY(26px); filter: blur(6px); }
    to{ opacity:1; transform: translateY(0); filter: blur(0); }
  }
  @keyframes revealOut{
    from{ opacity:1; transform: translateY(0); }
    to{ opacity:0; transform: translateY(-16px); }
  }

  .slide-dark{ background: linear-gradient(135deg, var(--violet-start) 0%, #4B0FB8 45%, var(--violet) 100%); background-size:220% 220%; animation: gradientDrift 18s ease-in-out infinite; color:#fff; }
  @keyframes gradientDrift{
    0%{ background-position: 0% 30%; }
    50%{ background-position: 100% 70%; }
    100%{ background-position: 0% 30%; }
  }
  .slide-light{ background:
      radial-gradient(900px 600px at 10% 0%, var(--tint, rgba(158,66,255,.08)), transparent 55%),
      radial-gradient(700px 500px at 100% 100%, var(--tint2, rgba(14,165,165,.07)), transparent 55%),
      #FAF9FC;
  }

  /* ---------- ORBIT / FLOATING ELEMENTS ---------- */
  .orbit-field{ position:absolute; inset:0; overflow:hidden; pointer-events:none; z-index:0; }
  .ring{ position:absolute; border-radius:50%; border:1px dashed rgba(255,255,255,.18); top:50%; left:50%; animation: spin linear infinite; }
  .slide-light .ring{ border-color: rgba(38,0,126,.10); }
  .ring .node{ position:absolute; top:-6px; left:50%; width:11px; height:11px; margin-left:-5px; border-radius:50%; background: var(--dot,#9E42FF); box-shadow:0 0 18px var(--dot,#9E42FF); }
  .ring.r1{ width:520px; height:520px; margin:-260px 0 0 -260px; animation-duration:34s; }
  .ring.r2{ width:820px; height:820px; margin:-410px 0 0 -410px; animation-duration:52s; animation-direction:reverse; }
  .ring.r3{ width:1140px; height:1140px; margin:-570px 0 0 -570px; animation-duration:70s; }
  @keyframes spin{ to{ transform: rotate(360deg); } }

  .blob{ position:absolute; border-radius:50%; filter: blur(90px); opacity:.30; animation: drift 22s ease-in-out infinite alternate; pointer-events:none; z-index:0; }
  @keyframes drift{ from{ transform: translate(0,0) scale(1); } to{ transform: translate(70px,-50px) scale(1.18); } }

  .particles{ position:absolute; inset:0; pointer-events:none; z-index:0; }
  .particle{ position:absolute; width:5px; height:5px; border-radius:50%; background:rgba(255,255,255,.55); animation: floatUp linear infinite; }
  .slide-light .particle{ background: rgba(38,0,126,.28); }
  @keyframes floatUp{
    from{ transform: translateY(0) translateX(0); opacity:0; }
    10%{ opacity:1; }
    90%{ opacity:1; }
    to{ transform: translateY(-140px) translateX(30px); opacity:0; }
  }

  /* ---------- GLASS ---------- */
  .glass{
    background: rgba(255,255,255,.6);
    backdrop-filter: blur(18px) saturate(160%);
    -webkit-backdrop-filter: blur(18px) saturate(160%);
    border: 1px solid rgba(255,255,255,.7);
    box-shadow: 0 8px 32px rgba(38,0,126,.10);
  }
  .slide-dark .glass{
    background: rgba(255,255,255,.10);
    border: 1px solid rgba(255,255,255,.28);
    box-shadow: 0 8px 32px rgba(0,0,0,.25);
  }

  /* ---------- COMMON TYPE ---------- */
  .eyebrow{ letter-spacing:.22em; text-transform:uppercase; font-size:15px; font-weight:700; opacity:.85; }
  .wordmark{ font-family:"Montserrat","Calibri",sans-serif; font-weight:800; letter-spacing:.06em; }
  h1.big-title{ font-family:"Montserrat","Calibri",sans-serif; font-weight:800; font-size:66px; line-height:1.06; letter-spacing:-.01em; }
  h2.section-title{ font-family:"Montserrat","Calibri",sans-serif; font-weight:800; font-size:40px; color:var(--indigo); letter-spacing:-.01em; }
  .subtitle{ font-size:21px; font-weight:400; opacity:.92; line-height:1.5; }
  .body-text{ color:var(--charcoal); font-size:16px; line-height:1.6; }
  .muted{ color: var(--slate); }

  /* ---------- TOP HEADER BAR (content slides) ---------- */
  .topbar{ position:relative; z-index:2; display:flex; align-items:center; justify-content:space-between; padding:30px 64px 0 64px; }
  .brand-mark{ display:flex; align-items:center; gap:10px; font-size:13px; letter-spacing:.18em; }
  .brand-mark .dot3{ display:inline-flex; gap:3px; }
  .brand-mark .dot3 span{ width:6px; height:6px; border-radius:1px; display:inline-block; }
  .pillar-chip{
    display:inline-flex; align-items:center; gap:10px; padding:8px 18px; border-radius:999px;
    font-weight:700; font-size:12.5px; letter-spacing:.07em; color:#fff;
  }

  /* ---------- COVER ---------- */
  .cover-wrap{ position:relative; flex:1; display:flex; flex-direction:column; justify-content:center; padding:0 100px; z-index:2; }
  .stat-row{ display:flex; gap:20px; margin-top:44px; }
  .stat-chip{ padding:18px 26px; border-radius:16px; min-width:170px; }
  .stat-chip .num{ font-family:"Montserrat","Calibri",sans-serif; font-size:38px; font-weight:800; line-height:1; }
  .stat-chip .lbl{ font-size:13px; letter-spacing:.08em; text-transform:uppercase; opacity:.8; margin-top:6px; }
  .cover-footer{ position:relative; z-index:2; display:flex; justify-content:space-between; padding:0 100px 46px 100px; font-size:14px; opacity:.85; }

  /* ---------- OVERVIEW GRID ---------- */
  .overview-wrap{ position:relative; z-index:2; flex:1; padding:22px 64px 20px 64px; display:flex; flex-direction:column; }
  .ptable-grid{ display:grid; grid-template-columns: repeat(5, 1fr); grid-auto-rows:150px; align-content:start; gap:16px; margin-top:22px; }
  .ptable-cell{
    position:relative; border-radius:14px; padding:16px 18px; color:#fff; overflow:hidden;
    display:flex; flex-direction:column; justify-content:space-between;
    transition: transform .25s ease, box-shadow .25s ease;
  }
  .ptable-cell:hover{ transform: translateY(-5px) scale(1.02); box-shadow: 0 14px 30px rgba(38,0,126,.30); z-index:5; }
  .ptable-cell .pnum{ font-size:11px; font-weight:700; opacity:.85; }
  .ptable-cell .psym{ font-family:"Montserrat","Calibri",sans-serif; font-size:26px; font-weight:800; line-height:1; margin-top:4px; }
  .ptable-cell .pname{ font-size:12.5px; line-height:1.3; font-weight:600; opacity:.96; margin-top:6px; }
  .ptable-cell .ppillar{ font-size:9.5px; letter-spacing:.08em; text-transform:uppercase; opacity:.75; margin-top:auto; }
  .legend-row{ display:flex; gap:22px; flex-wrap:wrap; padding-top:16px; margin-top:auto; }
  .legend-item{ display:flex; align-items:center; gap:9px; font-size:13px; font-weight:600; color:var(--charcoal); }
  .legend-swatch{ width:14px; height:14px; border-radius:4px; }

  /* ---------- WORKSTREAM SLIDES ---------- */
  .ws-wrap{ position:relative; z-index:2; flex:1; display:flex; flex-direction:column; padding:22px 60px 26px 60px; }
  .ws-num-badge{ font-family:"Montserrat","Calibri",sans-serif; font-size:110px; font-weight:800; line-height:1; opacity:.09; position:absolute; top:-8px; right:0px; }
  .ws-head{ position:relative; }
  .ws-title{ font-family:"Montserrat","Calibri",sans-serif; font-weight:800; font-size:38px; color:var(--indigo); letter-spacing:-.01em; margin-top:6px; }
  .purpose-strip{ display:flex; gap:10px; flex-wrap:wrap; margin-top:16px; }
  .purpose-pill{ display:flex; align-items:center; gap:8px; padding:8px 14px; border-radius:10px; font-size:12.5px; font-weight:600; color:#fff; }
  .purpose-label{ font-size:11px; font-weight:800; letter-spacing:.12em; text-transform:uppercase; color:var(--slate); margin-top:20px; }

  .level-flow{ flex:1; display:flex; align-items:center; gap:10px; margin-top:8px; }
  .level-card{
    flex:1; min-width:0; border-radius:16px; padding:18px 16px; display:flex; flex-direction:column;
    transition: transform .28s cubic-bezier(.16,1,.3,1), box-shadow .28s ease;
  }
  .level-card:hover{ transform: translateY(-6px); box-shadow: 0 16px 34px rgba(38,0,126,.18); z-index:6; }
  .lc-badge{ font-size:10.5px; font-weight:800; letter-spacing:.08em; text-transform:uppercase; color:#fff; display:inline-block; padding:4px 10px; border-radius:6px; width:fit-content; }
  .lc-title{ font-family:"Montserrat","Calibri",sans-serif; font-weight:800; font-size:14px; color:var(--indigo); margin-top:12px; line-height:1.25; min-height:36px; }
  .level-card ul{ margin-top:10px; list-style:none; padding:0; }
  .level-card li{ font-size:12px; line-height:1.5; padding-left:14px; position:relative; color:var(--charcoal); margin-bottom:6px; }
  .level-card li:before{ content:"\203A"; position:absolute; left:0; color:var(--gc,#9E42FF); font-weight:800; }
  .flow-arrow{ flex:0 0 auto; font-size:20px; color:var(--slate); opacity:.45; }

  /* ---------- CLOSING ---------- */
  .closing-wrap{ position:relative; z-index:2; flex:1; display:flex; flex-direction:column; justify-content:center; padding:0 100px; color:#fff; }
  .insight-grid{ display:grid; grid-template-columns: repeat(2,1fr); gap:18px; margin-top:36px; }
  .insight-card{ padding:22px 24px; border-radius:16px; }
  .insight-card .ic-num{ font-family:"Montserrat","Calibri",sans-serif; font-weight:800; font-size:26px; opacity:.5; }
  .insight-card p{ font-size:15.5px; line-height:1.55; margin-top:8px; }
  .cta-row{ margin-top:38px; display:flex; align-items:center; gap:20px; }
  .cta-btn{ padding:14px 30px; border-radius:999px; background:#fff; color:var(--indigo); font-weight:800; font-size:15px; letter-spacing:.02em; }
  .source-note{ font-size:12.5px; opacity:.7; margin-top:6px; }

  /* ---------- NAV / CONTROLS ---------- */
  #controls{
    position:fixed; left:50%; bottom:22px; transform:translateX(-50%);
    display:flex; align-items:center; gap:16px; z-index:50;
    padding:10px 18px; border-radius:999px;
    background: rgba(18,4,46,.55); backdrop-filter: blur(14px);
    border:1px solid rgba(255,255,255,.14);
  }
  .nav-btn{
    width:34px; height:34px; border-radius:50%; border:none; cursor:pointer;
    background: rgba(255,255,255,.12); color:#fff; font-size:15px;
    display:flex; align-items:center; justify-content:center;
    transition: background .2s ease, transform .2s ease;
  }
  .nav-btn:hover{ background: var(--violet); transform: scale(1.08); }
  #dots{ display:flex; gap:6px; max-width:520px; overflow:hidden; }
  .dot{ width:7px; height:7px; border-radius:50%; background: rgba(255,255,255,.28); cursor:pointer; transition: all .25s ease; flex:0 0 auto; }
  .dot.active{ background: var(--violet); width:20px; border-radius:5px; }
  #counter{ color:#fff; font-size:12px; letter-spacing:.05em; min-width:52px; text-align:center; opacity:.85; }

  #progress{ position:fixed; top:0; left:0; height:3px; background: linear-gradient(90deg, var(--violet), var(--teal)); z-index:60; transition: width .4s cubic-bezier(.16,1,.3,1); }

  .hint{ position:fixed; right:26px; bottom:26px; color:rgba(255,255,255,.55); font-size:11px; letter-spacing:.05em; z-index:50; }
</style>
</head>
<body>

<div id="viewport">
  <div id="stage">

  </div>
</div>

<div id="controls">
  <button class="nav-btn" id="prevBtn" aria-label="Previous">‹</button>
  <div id="dots"></div>
  <button class="nav-btn" id="nextBtn" aria-label="Next">›</button>
  <span id="counter">01 / 22</span>
</div>
<div class="hint">↑ ↓ / ← → to navigate</div>

const LEVEL_LABELS = [
  {key:'l1', label:'Level 1 · Enterprise Business Process'},
  {key:'l2', label:'Level 2 · Business Process Group'},
  {key:'l3', label:'Level 3 · Business Process'},
  {key:'l4', label:'Level 4 · Activity'},
  {key:'l5', label:'Level 5 · Task / Sub-Task'},
];

function orbitField(colorVar){
  return `<div class="orbit-field">
    <div class="ring r1"><span class="node" style="--dot:${colorVar}"></span></div>
    <div class="ring r2"><span class="node" style="--dot:${colorVar}"></span></div>
    <div class="ring r3"><span class="node" style="--dot:${colorVar}"></span></div>
  </div>`;
}
function blobs(c1,c2){
  return `<div class="blob" style="width:520px;height:520px;top:-140px;left:-100px;background:${c1};"></div>
  <div class="blob" style="width:420px;height:420px;bottom:-160px;right:-80px;background:${c2}; animation-delay:-8s;"></div>`;
}
function particles(n){
  let html='<div class="particles">';
  for(let i=0;i<n;i++){
    const left = (i*37)%100;
    const dur = 10 + (i%7)*2;
    const delay = (i%9)*1.6;
    const bottom = (i*13)%40;
    html += `<span class="particle" style="left:${left}%; bottom:${bottom}%; animation-duration:${dur}s; animation-delay:-${delay}s;"></span>`;
  }
  html += '</div>';
  return html;
}
function brandMark(color){
  return `<div class="brand-mark" style="color:${color}">
    <span class="dot3"><span style="background:#C41203"></span><span style="background:#82C21A"></span><span style="background:${color==='#fff'?'#ffffff':'#26007E'}"></span></span>
    <span class="wordmark">TRINAMIX</span>
  </div>`;
}

function buildOverviewGrid(){
  return DECK_DATA.workstreams.map((w,idx)=>{
    return `<div class="ptable-cell reveal" style="--i:${idx+1}; background:${w.color};">
      <div class="pnum">${String(w.num).padStart(2,'0')}</div>
      <div class="psym">${w.code}</div>
      <div class="pname">${w.name}</div>
      <div class="ppillar">${w.pillar}</div>
    </div>`;
  }).join('');
}

function buildLegend(){
  return DECK_DATA.pillars.map(p=>{
    return `<div class="legend-item"><span class="legend-swatch" style="background:${p.color}"></span>${p.title} · ${p.count}</div>`;
  }).join('');
}

function buildLevelCard(levelDef, idx, items, color){
  const lis = items.map(t=>`<li>${t}</li>`).join('');
  return `<div class="level-card glass reveal" style="--i:${idx}; --gc:${color};">
    <span class="lc-badge" style="background:${color}">L${idx}</span>
    <div class="lc-title">${levelDef.label.split('·')[1] ? levelDef.label.split('·')[1].trim() : levelDef.label}</div>
    <ul>${lis}</ul>
  </div>`;
}

function buildPurposeStrip(w){
  return w.purpose.map(t=>`<span class="purpose-pill" style="background:${w.color}">${t}</span>`).join('');
}

function buildWorkstreamSlide(w, pillarIdx, pillarCount){
  const levelCards = LEVEL_LABELS.map((ld,i)=> buildLevelCard(ld, i+1, w[ld.key], w.color)).join('<span class="flow-arrow reveal" style="--i:1;">→</span>');
  return `
  <div class="slide slide-light" data-tint="${w.color}">
    ${orbitField(w.color)}
    ${blobs(w.color+'40', w.color+'26')}
    <div class="topbar">
      ${brandMark('#26007E')}
      <div class="pillar-chip" style="background:${w.color}">WORKSTREAM ${String(w.num).padStart(2,'0')} OF 19 · ${w.pillar.toUpperCase()}</div>

    <div class="ws-wrap">
      <div class="ws-num-badge" style="color:${w.color}">${String(w.num).padStart(2,'0')}</div>
      <div class="ws-head reveal" style="--i:0;">
        <div class="eyebrow" style="color:${w.color};">${w.pillar}</div>
        <h1 class="ws-title">${w.name}</h1>
        <div class="purpose-label">Cloud Enterprise Function &amp; Purpose</div>
        <div class="purpose-strip">${buildPurposeStrip(w)}</div>
      </div>
      <div class="level-flow">${levelCards}</div>
    </div>
  </div>`;
}

function buildClosingSlide(){

function render(){

/* ---------------- NAVIGATION ---------------- */
const stage = document.getElementById('stage');
let slideEls = Array.from(document.querySelectorAll('.slide'));
const total = slideEls.length;
let current = 0;
let animating = false;

const dotsWrap = document.getElementById('dots');
slideEls.forEach((_, i)=>{
  const d = document.createElement('div');
  d.className = 'dot' + (i===0 ? ' active' : '');
  d.addEventListener('click', ()=> goTo(i));
  dotsWrap.appendChild(d);
});
const dotEls = Array.from(dotsWrap.children);

function updateChrome(){
  dotEls.forEach((d,i)=> d.classList.toggle('active', i===current));
  document.getElementById('counter').textContent = String(current+1).padStart(2,'0') + ' / ' + String(total).padStart(2,'0');
  document.getElementById('progress').style.width = (((current+1)/total)*100) + '%';
}

function goTo(idx){
  if(animating || idx===current || idx<0 || idx>=total) return;
  animating = true;
  const prev = slideEls[current];
  const next = slideEls[idx];
  prev.classList.remove('active');
  prev.classList.add('leaving');
  next.classList.add('active');
  current = idx;
  updateChrome();
  setTimeout(()=>{ prev.classList.remove('leaving'); animating = false; }, 520);
}

document.getElementById('prevBtn').addEventListener('click', ()=> goTo(current-1));
document.getElementById('nextBtn').addEventListener('click', ()=> goTo(current+1));

window.addEventListener('keydown', (e)=>{
  if(['ArrowRight','ArrowDown','PageDown',' '].includes(e.key)){ e.preventDefault(); goTo(current+1); }
  if(['ArrowLeft','ArrowUp','PageUp'].includes(e.key)){ e.preventDefault(); goTo(current-1); }
  if(e.key==='Home') goTo(0);
  if(e.key==='End') goTo(total-1);
});

let touchStartX = null;
document.addEventListener('touchstart', e=> touchStartX = e.touches[0].clientX);
document.addEventListener('touchend', e=>{
  if(touchStartX===null) return;
  const dx = e.changedTouches[0].clientX - touchStartX;
  if(Math.abs(dx) > 50){ dx < 0 ? goTo(current+1) : goTo(current-1); }
  touchStartX = null;
});

/* init first slide active */
slideEls[0].classList.add('active');
updateChrome();

/* ---------------- SCALE TO FIT ---------------- */
function scaleStage(){
  const stageW = 1920, stageH = 1080;
  const scale = Math.min(window.innerWidth/stageW, window.innerHeight/stageH);
  document.getElementById('stage').style.transform = `scale(${scale})`;
}
document.getElementById('stage').style.transformOrigin = 'center center';
scaleStage();
window.addEventListener('resize', scaleStage);
</script>
