<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Periodic Table of Oracle AI Agents — Trinamix</title>
<style>
  :root{
    --indigo:#26007E;
    --violet-start:#2C0385;
    --violet:#9E42FF;
    --teal:#0EA5A5;
    --charcoal:#22252B;
    --slate:#595966;
    --white:#FFFFFF;
    --stage-w: 1920px;
    --stage-h: 1080px;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{
    width:100%; height:100%; overflow:hidden;
    background: #12042E;
    font-family: "Calibri","Segoe UI",Arial,sans-serif;
    color: var(--charcoal);
  }
  #viewport{
    position:fixed; inset:0;
    display:flex; align-items:center; justify-content:center;
    background:
      radial-gradient(1200px 800px at 15% 10%, rgba(158,66,255,.16), transparent 60%),
      radial-gradient(1000px 700px at 85% 90%, rgba(14,165,165,.14), transparent 60%),
      #12042E;
  }
  #stage{
    position:relative;
    width:var(--stage-w); height:var(--stage-h);
    background:#ffffff;
    overflow:hidden;
    box-shadow: 0 40px 120px rgba(0,0,0,.55);
    border-radius: 6px;
  }

  /* ---------- SLIDES ---------- */
  .slide{
    position:absolute; inset:0;
    opacity:0; pointer-events:none;
    display:flex; flex-direction:column;
    overflow:hidden;
  }
  .slide.active{ opacity:1; pointer-events:auto; z-index:2; }
  .slide.leaving{ opacity:1; z-index:1; }
  .slide.leaving .reveal{ animation: revealOut .45s ease forwards; }
  .slide .reveal{ opacity:0; }
  .slide.active .reveal{
    animation: revealIn .7s cubic-bezier(.16,1,.3,1) forwards;
    animation-delay: calc(var(--i,0) * 70ms);
  }
  .slide.active .ptable-cell.reveal{
    animation-delay: calc(var(--i,0) * 16ms);
  }
  @keyframes revealIn{
    from{ opacity:0; transform: translateY(26px); filter: blur(6px); }
    to{ opacity:1; transform: translateY(0); filter: blur(0); }
  }
  @keyframes revealOut{
    from{ opacity:1; transform: translateY(0); }
    to{ opacity:0; transform: translateY(-16px); }
  }

  .slide-dark{ background: linear-gradient(135deg, var(--violet-start) 0%, #4B0FB8 45%, var(--violet) 100%); background-size:220% 220%; animation: gradientDrift 18s ease-in-out infinite; color:#fff; }
  @keyframes gradientDrift{
    0%{ background-position: 0% 30%; }
    50%{ background-position: 100% 70%; }
    100%{ background-position: 0% 30%; }
  }
  .slide-light{ background:
      radial-gradient(900px 600px at 10% 0%, var(--tint, rgba(158,66,255,.08)), transparent 55%),
      radial-gradient(700px 500px at 100% 100%, var(--tint2, rgba(14,165,165,.07)), transparent 55%),
      #FAF9FC;
  }

  /* ---------- ORBIT / FLOATING ELEMENTS ---------- */
  .orbit-field{ position:absolute; inset:0; overflow:hidden; pointer-events:none; z-index:0; }
  .ring{ position:absolute; border-radius:50%; border:1px dashed rgba(255,255,255,.18); top:50%; left:50%; animation: spin linear infinite; }
  .slide-light .ring{ border-color: rgba(38,0,126,.10); }
  .ring .node{ position:absolute; top:-6px; left:50%; width:11px; height:11px; margin-left:-5px; border-radius:50%; background: var(--dot,#9E42FF); box-shadow:0 0 18px var(--dot,#9E42FF); }
  .ring.r1{ width:520px; height:520px; margin:-260px 0 0 -260px; animation-duration:34s; }
  .ring.r2{ width:820px; height:820px; margin:-410px 0 0 -410px; animation-duration:52s; animation-direction:reverse; }
  .ring.r3{ width:1140px; height:1140px; margin:-570px 0 0 -570px; animation-duration:70s; }
  @keyframes spin{ to{ transform: rotate(360deg); } }

  .blob{ position:absolute; border-radius:50%; filter: blur(90px); opacity:.30; animation: drift 22s ease-in-out infinite alternate; pointer-events:none; z-index:0; }
  @keyframes drift{ from{ transform: translate(0,0) scale(1); } to{ transform: translate(70px,-50px) scale(1.18); } }

  .particles{ position:absolute; inset:0; pointer-events:none; z-index:0; }
  .particle{ position:absolute; width:5px; height:5px; border-radius:50%; background:rgba(255,255,255,.55); animation: floatUp linear infinite; }
  .slide-light .particle{ background: rgba(38,0,126,.28); }
  @keyframes floatUp{
    from{ transform: translateY(0) translateX(0); opacity:0; }
    10%{ opacity:1; }
    90%{ opacity:1; }
    to{ transform: translateY(-140px) translateX(30px); opacity:0; }
  }

  /* ---------- GLASS ---------- */
  .glass{
    background: rgba(255,255,255,.6);
    backdrop-filter: blur(18px) saturate(160%);
    -webkit-backdrop-filter: blur(18px) saturate(160%);
    border: 1px solid rgba(255,255,255,.7);
    box-shadow: 0 8px 32px rgba(38,0,126,.10);
  }
  .slide-dark .glass{
    background: rgba(255,255,255,.10);
    border: 1px solid rgba(255,255,255,.28);
    box-shadow: 0 8px 32px rgba(0,0,0,.25);
  }

  /* ---------- COMMON TYPE ---------- */
  .eyebrow{ letter-spacing:.22em; text-transform:uppercase; font-size:15px; font-weight:700; opacity:.85; }
  .wordmark{ font-family:"Montserrat","Calibri",sans-serif; font-weight:800; letter-spacing:.06em; }
  h1.big-title{ font-family:"Montserrat","Calibri",sans-serif; font-weight:800; font-size:70px; line-height:1.05; letter-spacing:-.01em; }
  h2.section-title{ font-family:"Montserrat","Calibri",sans-serif; font-weight:800; font-size:46px; color:var(--indigo); letter-spacing:-.01em; }
  .subtitle{ font-size:22px; font-weight:400; opacity:.92; line-height:1.5; }
  .body-text{ color:var(--charcoal); font-size:17px; line-height:1.6; }
  .muted{ color: var(--slate); }

  /* ---------- TOP HEADER BAR (content slides) ---------- */
  .topbar{ position:relative; z-index:2; display:flex; align-items:center; justify-content:space-between; padding:34px 64px 0 64px; }
  .brand-mark{ display:flex; align-items:center; gap:10px; font-size:13px; letter-spacing:.18em; }
  .brand-mark .dot3{ display:inline-flex; gap:3px; }
  .brand-mark .dot3 span{ width:6px; height:6px; border-radius:1px; display:inline-block; }
  .pillar-chip{
    display:inline-flex; align-items:center; gap:10px; padding:8px 18px; border-radius:999px;
    font-weight:700; font-size:13px; letter-spacing:.08em; color:#fff;
  }

  /* ---------- COVER (Slide 1) ---------- */
  .cover-wrap{ position:relative; flex:1; display:flex; flex-direction:column; justify-content:center; padding:0 100px; z-index:2; }
  .stat-row{ display:flex; gap:20px; margin-top:44px; }
  .stat-chip{ padding:18px 26px; border-radius:16px; min-width:170px; }
  .stat-chip .num{ font-family:"Montserrat","Calibri",sans-serif; font-size:38px; font-weight:800; line-height:1; }
  .stat-chip .lbl{ font-size:13px; letter-spacing:.08em; text-transform:uppercase; opacity:.8; margin-top:6px; }
  .cover-footer{ position:relative; z-index:2; display:flex; justify-content:space-between; padding:0 100px 46px 100px; font-size:14px; opacity:.85; }

  /* ---------- OVERVIEW GRID (Slide 2) ---------- */
  .overview-wrap{ position:relative; z-index:2; flex:1; padding:22px 64px 20px 64px; display:flex; flex-direction:column; }
  .ptable-grid{ display:grid; grid-template-columns: repeat(9, 1fr); grid-auto-rows:108px; align-content:start; gap:8px; margin-top:18px; }
  .ptable-cell{
    position:relative; border-radius:10px; padding:8px 9px; color:#fff; overflow:hidden;
    display:flex; flex-direction:column; justify-content:space-between;
    transition: transform .25s ease, box-shadow .25s ease;
  }
  .ptable-cell:hover{ transform: translateY(-4px) scale(1.035); box-shadow: 0 10px 24px rgba(38,0,126,.28); z-index:5; }
  .ptable-cell .pnum{ font-size:10px; font-weight:700; opacity:.85; }
  .ptable-cell .psym{ font-family:"Montserrat","Calibri",sans-serif; font-size:20px; font-weight:800; line-height:1; margin-top:2px; }
  .ptable-cell .pname{ font-size:9px; line-height:1.2; font-weight:600; opacity:.95; margin-top:4px; }
  .legend-row{ display:flex; gap:22px; flex-wrap:wrap; padding-top:14px; margin-top:auto; }
  .legend-item{ display:flex; align-items:center; gap:9px; font-size:13px; font-weight:600; color:var(--charcoal); }
  .legend-swatch{ width:14px; height:14px; border-radius:4px; }

  /* ---------- GROUP SLIDES (3-8) ---------- */
  .group-wrap{ position:relative; z-index:2; flex:1; display:flex; padding:26px 64px 30px 64px; gap:40px; }
  .group-side{ width:340px; flex-shrink:0; display:flex; flex-direction:column; justify-content:flex-start; padding-top:18px; }
  .group-num-badge{ font-family:"Montserrat","Calibri",sans-serif; font-size:100px; font-weight:800; line-height:1; opacity:.14; position:absolute; top:6px; right:-6px; }
  .group-side .count-pill{ display:inline-flex; align-items:center; gap:8px; padding:8px 16px; border-radius:999px; font-weight:700; font-size:13px; color:#fff; width:fit-content; margin-top:16px; }
  .group-side .group-blurb{ margin-top:18px; font-size:16px; line-height:1.6; color:var(--slate); }
  .group-main{ flex:1; display:grid; gap:14px; align-content:start; }
  .agent-card{
    position:relative; border-radius:14px; padding:16px 18px; cursor:default;
    transition: transform .28s cubic-bezier(.16,1,.3,1), box-shadow .28s ease;
  }
  .agent-card:hover{ transform: translateY(-6px); box-shadow: 0 16px 34px rgba(38,0,126,.18); z-index:6; }
  .agent-card .a-top{ display:flex; align-items:center; gap:10px; }
  .agent-card .a-num{ font-size:11px; font-weight:800; color:#fff; background:var(--gc,#9E42FF); border-radius:6px; padding:2px 7px; }
  .agent-card .a-sym{ font-family:"Montserrat","Calibri",sans-serif; font-weight:800; font-size:15px; color:var(--gc,#9E42FF); letter-spacing:.03em; }
  .agent-card .a-name{ font-weight:700; font-size:15px; color:var(--indigo); margin-top:8px; line-height:1.25; }
  .agent-card .a-cap{ font-size:12.5px; color:var(--slate); margin-top:6px; line-height:1.45; }
  .agent-card .a-more{ max-height:0; overflow:hidden; transition: max-height .35s ease, opacity .3s ease; opacity:0; }
  .agent-card:hover .a-more{ max-height:160px; opacity:1; margin-top:8px; }
  .agent-card .a-more ul{ list-style:none; padding:0; }
  .agent-card .a-more li{ font-size:11.5px; color:var(--charcoal); padding:3px 0 3px 14px; position:relative; line-height:1.4; }
  .agent-card .a-more li:before{ content:"›"; position:absolute; left:0; color:var(--gc,#9E42FF); font-weight:800; }
  .agent-card .a-module{ margin-top:8px; display:inline-block; font-size:10.5px; font-weight:700; letter-spacing:.03em; color:var(--gc,#9E42FF); background: rgba(0,0,0,.04); padding:3px 8px; border-radius:6px; }

  .cols-5{ grid-template-columns: repeat(5,1fr); }
  .cols-4{ grid-template-columns: repeat(4,1fr); }
  .cols-3{ grid-template-columns: repeat(3,1fr); }
  .cols-2{ grid-template-columns: repeat(2,1fr); }

  /* bigger cards for small groups */
  .group-main.cols-4 .agent-card, .group-main.cols-2 .agent-card{ padding:26px 26px; }
  .group-main.cols-4 .a-name, .group-main.cols-2 .a-name{ font-size:19px; margin-top:12px; }
  .group-main.cols-4 .a-cap, .group-main.cols-2 .a-cap{ font-size:14px; margin-top:8px; }
  .group-main.cols-4 .agent-card:hover .a-more, .group-main.cols-2 .agent-card:hover .a-more{ max-height:220px; }
  .group-main.cols-4 .a-more li, .group-main.cols-2 .a-more li{ font-size:13px; }

  /* ---------- CLOSING (Slide 9) ---------- */
  .closing-wrap{ position:relative; z-index:2; flex:1; display:flex; flex-direction:column; justify-content:center; padding:0 100px; color:#fff; }
  .insight-grid{ display:grid; grid-template-columns: repeat(2,1fr); gap:18px; margin-top:36px; }
  .insight-card{ padding:22px 24px; border-radius:16px; }
  .insight-card .ic-num{ font-family:"Montserrat","Calibri",sans-serif; font-weight:800; font-size:26px; opacity:.5; }
  .insight-card p{ font-size:15.5px; line-height:1.55; margin-top:8px; }
  .cta-row{ margin-top:38px; display:flex; align-items:center; gap:20px; }
  .cta-btn{ padding:14px 30px; border-radius:999px; background:#fff; color:var(--indigo); font-weight:800; font-size:15px; letter-spacing:.02em; }
  .source-note{ font-size:12.5px; opacity:.7; margin-top:6px; }

  /* ---------- NAV / CONTROLS ---------- */
  #controls{
    position:fixed; left:50%; bottom:22px; transform:translateX(-50%);
    display:flex; align-items:center; gap:16px; z-index:50;
    padding:10px 18px; border-radius:999px;
    background: rgba(18,4,46,.55); backdrop-filter: blur(14px);
    border:1px solid rgba(255,255,255,.14);
  }
  .nav-btn{
    width:34px; height:34px; border-radius:50%; border:none; cursor:pointer;
    background: rgba(255,255,255,.12); color:#fff; font-size:15px;
    display:flex; align-items:center; justify-content:center;
    transition: background .2s ease, transform .2s ease;
  }
  .nav-btn:hover{ background: var(--violet); transform: scale(1.08); }
  #dots{ display:flex; gap:8px; }
  .dot{ width:8px; height:8px; border-radius:50%; background: rgba(255,255,255,.28); cursor:pointer; transition: all .25s ease; }
  .dot.active{ background: var(--violet); width:22px; border-radius:5px; }
  #counter{ color:#fff; font-size:12px; letter-spacing:.05em; min-width:46px; text-align:center; opacity:.85; }

  #progress{ position:fixed; top:0; left:0; height:3px; background: linear-gradient(90deg, var(--violet), var(--teal)); z-index:60; transition: width .4s cubic-bezier(.16,1,.3,1); }

  .hint{ position:fixed; right:26px; bottom:26px; color:rgba(255,255,255,.55); font-size:11px; letter-spacing:.05em; z-index:50; }
</style>
</head>
<body>

<div id="progress" style="width:11.1%"></div>
<div id="viewport">
  <div id="stage">
    <!-- SLIDES_PLACEHOLDER -->
  </div>
</div>

<div id="controls">
  <button class="nav-btn" id="prevBtn" aria-label="Previous">‹</button>
  <div id="dots"></div>
  <button class="nav-btn" id="nextBtn" aria-label="Next">›</button>
  <span id="counter">01 / 09</span>
</div>
<div class="hint">↑ ↓ / ← → to navigate</div>

<script>
const DECK_DATA = {"groups": {"financials": {"title": "ERP Financials", "short": "FIN", "color": "#9E42FF", "blurb": "Record-to-report automation across ledger, payables, expenses, payments, reconciliations, and close."}, "scm": {"title": "Supply Chain Management", "short": "SCM", "color": "#7C4FE0", "blurb": "Planning, sourcing, manufacturing, and inventory agents spanning plan-to-produce and source-to-pay."}, "hcm": {"title": "Human Capital Management", "short": "HCM", "color": "#5C5CE0", "blurb": "Hire-to-retire agents covering talent, workforce operations, coaching, and manager self-service."}, "platform": {"title": "Platform, Integration & Analytics", "short": "OCI · OIC · OAC", "color": "#3D6FDB", "blurb": "The underlying agent infrastructure — generative AI services, integration orchestration, and conversational analytics."}, "projects": {"title": "Projects & Plan-to-Manufacture", "short": "PPM · PTM", "color": "#1E8FC7", "blurb": "Project financial automation plus the cross-pillar plan-to-manufacture agent set."}, "cpq": {"title": "CPQ / CX", "short": "CPQ", "color": "#0EA5A5", "blurb": "Quote-to-cash agents that generate, validate, and advise on configured pricing and deals."}}, "agents": [{"num": 1, "symbol": "LE", "name": "Ledger Agent", "group": "financials", "pillarLabel": "ERP - Financials", "bullets": ["Natural-language Q&A against the General Ledger", "Continuous automated monitoring with user-defined prompts", "Context-aware variance explanations (no canned reports needed)"], "module": "General Ledger (GL) module"}, {"num": 2, "symbol": "PA", "name": "Payables Agent (Document Agent)", "group": "financials", "pillarLabel": "ERP - Financials", "bullets": ["Ingests invoices from email, supplier portals, EDI/e-invoicing, and PDFs", "Extracts and normalizes invoice data", "Matches to POs/receipts (2-/3-way match)"], "module": "Payables (AP) module, feeding Procure-to-Pay"}, {"num": 3, "symbol": "EX", "name": "Expenses Agent", "group": "financials", "pillarLabel": "ERP - Financials", "bullets": ["Reads a forwarded receipt (email or upload)", "Extracts merchant, date, amount, category", "Matches to the corresponding corporate-card charge"], "module": "Expenses module"}, {"num": 4, "symbol": "PA2", "name": "Payments Agent", "group": "financials", "pillarLabel": "ERP - Financials", "bullets": ["Automates payment run preparation and execution", "Applies payment method/timing rules", "Flags exceptions (duplicate payments, bank detail mismatches)"], "module": "Cash Management / Payments module, downstream of Payables"}, {"num": 5, "symbol": "FM", "name": "Financial Monitoring Agent", "group": "financials", "pillarLabel": "ERP - Financials", "bullets": ["User sets natural-language monitoring prompts (e.g., \"alert me if opex exceeds budget by 5%\")", "Delivers context-aware variance explanations", "Auto-creates adjustment journals"], "module": "General Ledger / FP&A monitoring layer, complementary to the Ledger Agent"}, {"num": 6, "symbol": "IR", "name": "Intercompany Reconciliation Agent", "group": "financials", "pillarLabel": "ERP - Financials", "bullets": ["Matches cross-entity balances across Oracle ledgers", "Proposes eliminations", "Removes a standard close bottleneck"], "module": "Intercompany accounting within Financial Consolidation and Close / GL"}, {"num": 7, "symbol": "FA", "name": "Fixed Assets Reconciliation Agent", "group": "financials", "pillarLabel": "ERP - Financials", "bullets": ["Reconciles the fixed-asset subledger to the GL on a rolling basis", "Explains and routes reconciliation breaks for review"], "module": "Assets module, feeding Acquire-to-Retire and period close"}, {"num": 8, "symbol": "BC", "name": "Bank / Cash Reconciliation Agent", "group": "financials", "pillarLabel": "ERP - Financials", "bullets": ["Imports and auto-matches bank statements to Cash Management transactions", "Investigates and proposes clearing for unmatched items"], "module": "Cash Management module, feeding Consolidation-to- function orbitField(colorVar){
  return `<div class="orbit-field">
    <div class="ring r1"><span class="node" style="--dot:${colorVar}"></span></div>
    <div class="ring r2"><span class="node" style="--dot:${colorVar}"></span></div>
    <div class="ring r3"><span class="node" style="--dot:${colorVar}"></span></div>
  </div>`;
}
function blobs(c1,c2){
  return `<div class="blob" style="width:520px;height:520px;top:-140px;left:-100px;background:${c1};"></div>
  <div class="blob" style="width:420px;height:420px;bottom:-160px;right:-80px;background:${c2}; animation-delay:-8s;"></div>`;
}
function particles(n){
  let html='<div class="particles">';
  for(let i=0;i<n;i++){
    const left = Math.random()*100;
    const dur = 10 + Math.random()*14;
    const delay = Math.random()*14;
    html += `<span class="particle" style="left:${left}%; bottom:${Math.random()*40}%; animation-duration:${dur}s; animation-delay:-${delay}s;"></span>`;
  }
  html += '</div>';
  return html;
}

const GROUP_ORDER = ["financials","scm","hcm","platform","projects","cpq"];

function buildOverviewGrid(){
  return DECK_DATA.agents.map((a,idx)=>{
    const g = DECK_DATA.groups[a.group];
    return `<div class="ptable-cell reveal" style="--i:${idx+1}; background:${g.color};">
      <div class="pnum">${String(a.num).padStart(2,'0')}</div>
      <div class="psym">${a.symbol}</div>
      <div class="pname">${a.name}</div>
    </div>`;
  }).join('');
}

function buildLegend(){
  return GROUP_ORDER.map(k=>{
    const g = DECK_DATA.groups[k];
    const count = DECK_DATA.agents.filter(a=>a.group===k).length;
    return `<div class="legend-item"><span class="legend-swatch" style="background:${g.color}"></span>${g.title} · ${count}</div>`;
  }).join('');
}

function colClassFor(count){
  if(count<=2) return 'cols-2';
  if(count<=4) return 'cols-4';
  if(count<=6) return 'cols-3';
  return 'cols-5';
}

function buildAgentCard(a, idx, color){
  const bullets = a.bullets.slice(1).map(b=>`<li>${b}</li>`).join('');
  return `<div class="agent-card glass reveal" style="--i:${idx+1}; --gc:${color};">
    <div class="a-top">
      <span class="a-num">${String(a.num).padStart(2,'0')}</span>
      <span class="a-sym">${a.symbol}</span>
    </div>
    <div class="a-name">${a.name}</div>
    <div class="a-cap">${a.bullets[0] || ''}</div>
    <div class="a-more">
      <ul>${bullets}</ul>
      ${a.module ? `<span class="a-module">${a.module}</span>` : ''}
    </div>
  </div>`;
}

function buildGroupSlide(groupKey, num){

  return `
  <div class="slide slide-light" data-tint="${g.color}">
    ${orbitField(g.color)}
    ${blobs(g.color+'55', g.color+'33')}
    <div class="topbar">

        </div>
      </div>
      <div class="group-main ${cols}">
        ${cards}
      </div>
    </div>
  </div>`;
}

/* ---------------- NAVIGATION ---------------- */
const stage = document.getElementById('stage');
let slideEls = Array.from(document.querySelectorAll('.slide'));
const total = slideEls.length;
let current = 0;
let animating = false;

const dotsWrap = document.getElementById('dots');
slideEls.forEach((_, i)=>{
  const d = document.createElement('div');
  d.className = 'dot' + (i===0 ? ' active' : '');
  d.addEventListener('click', ()=> goTo(i));
  dotsWrap.appendChild(d);
});
const dotEls = Array.from(dotsWrap.children);

function updateChrome(){
  dotEls.forEach((d,i)=> d.classList.toggle('active', i===current));
  document.getElementById('counter').textContent = String(current+1).padStart(2,'0') + ' / ' + String(total).padStart(2,'0');
  document.getElementById('progress').style.width = (((current+1)/total)*100) + '%';
}

function goTo(idx){
  if(animating || idx===current || idx<0 || idx>=total) return;
  animating = true;
  const prev = slideEls[current];
  const next = slideEls[idx];
  prev.classList.remove('active');
  prev.classList.add('leaving');
  next.classList.add('active');
  current = idx;
  updateChrome();
  setTimeout(()=>{ prev.classList.remove('leaving'); animating = false; }, 520);
}

document.getElementById('prevBtn').addEventListener('click', ()=> goTo(current-1));
document.getElementById('nextBtn').addEventListener('click', ()=> goTo(current+1));

window.addEventListener('keydown', (e)=>{
  if(['ArrowRight','ArrowDown','PageDown',' '].includes(e.key)){ e.preventDefault(); goTo(current+1); }
  if(['ArrowLeft','ArrowUp','PageUp'].includes(e.key)){ e.preventDefault(); goTo(current-1); }
  if(e.key==='Home') goTo(0);
  if(e.key==='End') goTo(total-1);
});

let touchStartX = null;
document.addEventListener('touchstart', e=> touchStartX = e.touches[0].clientX);
document.addEventListener('touchend', e=>{
  if(touchStartX===null) return;
  const dx = e.changedTouches[0].clientX - touchStartX;
  if(Math.abs(dx) > 50){ dx < 0 ? goTo(current+1) : goTo(current-1); }
  touchStartX = null;
});

/* init first slide active */
slideEls[0].classList.add('active');
updateChrome();

/* ---------------- SCALE TO FIT ---------------- */
function scaleStage(){
  const stageW = 1920, stageH = 1080;
  const scale = Math.min(window.innerWidth/stageW, window.innerHeight/stageH);
  document.getElementById('stage').style.transform = `scale(${scale})`;
}
document.getElementById('stage').style.transformOrigin = 'center center';
scaleStage();
window.addEventListener('resize', scaleStage);
